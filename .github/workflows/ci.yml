name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js v22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Install Compact compiler
      run: npm install -g @midnight-ntwrk/compact-compiler

    - name: Compact Compile
      run: npm run compile

    - name: Run test suite
      run: npm test
